name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Reads the exact version from package.json; never runs deployment.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests, production build and SSR regression
        run: pnpm test
      - name: Local D1 fixture workflow
        run: |
          cp .dev.vars.example .dev.vars
          pnpm db:local:migrate
          pnpm db:local:verify-integrity
          pnpm local:verify:e2e
